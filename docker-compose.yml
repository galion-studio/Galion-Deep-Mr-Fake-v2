# CPU-only web app. From the repo root: docker compose up --build
# Then open http://127.0.0.1:8765

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: galion-deep-mr-fake-web:local
    ports:
      - "8765:8765"
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
